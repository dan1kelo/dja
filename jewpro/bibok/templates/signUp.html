{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"Sign up" }}</title>
    <link rel="stylesheet" href="{% static 'bibok/css/main.css' %}">
</head>
<body>
    <form class="auth" method="post" action="{% url 'signup' %}">
        {% csrf_token %}
        <h1>Guess the movie</h1>
        {% for field in form %}{% for error in field.errors %}<p class="error">{{ error }}</p>{% endfor %}{% endfor %}
        {% for error in form.non_field_errors %}<p class="error">{{ error }}</p>{% endfor %}
        <input type="text" name="username" placeholder="user name" value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus>
        <input type="password" name="password1" placeholder="password" autocomplete="new-password" required>
        <input type="password" name="password2" placeholder="password confirmation" autocomplete="new-password" required>
        <button type="submit" class="btn">Sign up</button>
        <a class="switch" href="{% url 'login' %}">Login</a>
    </form>
</body>
</html>
