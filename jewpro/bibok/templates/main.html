{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title|default:"Jewpro" }}</title>
    <link rel="stylesheet" href="{% static 'bibok/css/main.css' %}">
</head>
<body>
    <main class="home">
        <h1>Guess the movie</h1>
        <a href="{% url 'game' %}" class="btn">Start game</a>
        <form method="post" action="{% url 'logout' %}" class="logout">
            {% csrf_token %}
            <button class="link">Logout{% if user.is_authenticated %} ({{ user.username }}){% endif %}</button>
        </form>
    </main>
</body>
</html>
